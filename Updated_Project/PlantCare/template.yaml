              },
              "Path": "/api/state",
              "Method": "GET"
            }
          },
          "Route4": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/history",
              "Method": "GET"
            }
          },
          "Route5": {
