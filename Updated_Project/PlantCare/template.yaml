      }
    },
    "Demo": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": ".",
        "Runtime": "python3.12",
        "Handler": "aws.demo.handler",
        "Timeout": 5,
        "Environment": {
          "Variables": {
            "HISTORY_TABLE": {
              "Ref": "History"
            }
          }
        },
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": "dynamodb:GetItem",
                "Resource": {
                  "Fn::GetAtt": [
                    "History",
                    "Arn"
                  ]
                },
                "Condition": {
                  "ForAllValues:StringEquals": {
                    "dynamodb:LeadingKeys": [
                      "live"
                    ]
                  },
                  "Null": {
                    "dynamodb:LeadingKeys": "false"
                  }
                }
              }
            ]
          }
        ],
        "Events": {
          "Home": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/",
              "Method": "GET",
              "Auth": {
                "Authorizer": "NONE"
              }
            }
          },
          "Script": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/app.js",
              "Method": "GET",
              "Auth": {
                "Authorizer": "NONE"
              }
            }
          },
          "Styles": {
