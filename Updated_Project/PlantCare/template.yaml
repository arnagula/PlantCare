                "Ref": "HttpApi"
              },
              "Path": "/api/demo/telemetry",
              "Method": "GET",
              "Auth": {
                "Authorizer": "NONE"
              }
            }
          }
        }
      },
      "Metadata": {
        "BuildMethod": "makefile"
      }
    }
