              },
              {
                "Effect": "Allow",
                "Action": "sqs:SendMessage",
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "LiveQueue",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::GetAtt": [
                      "SimQueue",
                      "Arn"
                    ]
                  }
                ]
              }
            ]
          }
        ],
        "Events": {
