{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Parameters": {
    "IoTDataEndpoint": {
      "Type": "String"
    },
    "JwtIssuer": {
      "Type": "String"
    },
    "JwtAudience": {
      "Type": "String"
    },
    "BackendGeneration": {
      "Type": "String",
      "Default": "deployment-1"
    }
  },
  "Resources": {
    "History": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "sk",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "pk",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "sk",
            "KeyType": "RANGE"
          }
        ],
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        }
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "LiveDLQ": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "FifoQueue": true,
        "MessageRetentionPeriod": 1209600
      }
    },
    "LiveQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "FifoQueue": true,
        "VisibilityTimeout": 180,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "LiveDLQ",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "LiveDeadLetterAlarm": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/SQS",
        "MetricName": "ApproximateNumberOfMessagesVisible",
        "Dimensions": [
          {
            "Name": "QueueName",
            "Value": {
              "Fn::GetAtt": [
                "LiveDLQ",
                "QueueName"
              ]
            }
          }
        ],
        "Statistic": "Maximum",
        "Period": 60,
        "EvaluationPeriods": 1,
        "Threshold": 0,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching"
      }
    },
    "LiveWorker": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": ".",
        "Runtime": "python3.12",
        "Handler": "aws.handler.worker",
        "Timeout": 30,
        "Environment": {
          "Variables": {
            "EXPECTED_MODE": "live",
            "HISTORY_TABLE": {
              "Ref": "History"
            },
            "IOT_DATA_ENDPOINT": {
              "Ref": "IoTDataEndpoint"
            },
            "BACKEND_GENERATION": {
              "Ref": "BackendGeneration"
            },
            "LIVE_QUEUE": {
              "Ref": "LiveQueue"
            },
            "SIM_QUEUE": {
              "Ref": "SimQueue"
            }
          }
        },
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:PutItem"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "History",
                    "Arn"
                  ]
                },
                "Condition": {
                  "ForAllValues:StringEquals": {
                    "dynamodb:LeadingKeys": [
                      "live"
                    ]
                  }
                }
              },
              {
                "Effect": "Allow",
                "Action": "iot:Publish",
                "Resource": [
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/plantcare/team3/pothos1/condition"
                  },
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/plantcare/team3/pothos1/watering/command"
                  },
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/plantcare/team3/pothos1/control/command"
                  },
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/plantcare/team3/pothos1/status/backend"
                  }
                ]
              },
              {
                "Effect": "Allow",
                "Action": "iot:RetainPublish",
                "Resource": [
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/plantcare/team3/pothos1/condition"
                  },
                  {
                    "Fn::Sub": "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/plantcare/team3/pothos1/status/backend"
                  }
                ]
              }
            ]
          }
        ],
        "Events": {
          "Queue": {
            "Type": "SQS",
            "Properties": {
              "Queue": {
                "Fn::GetAtt": [
                  "LiveQueue",
                  "Arn"
                ]
              },
              "BatchSize": 1
            }
          }
        }
      },
      "Metadata": {
        "BuildMethod": "makefile"
      }
    },
    "LiveIngress": {
