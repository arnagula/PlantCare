            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/watering",
              "Method": "GET"
            }
          },
          "Route6": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/request",
              "Method": "GET"
            }
          },
          "Route7": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/watering",
              "Method": "POST"
            }
          },
          "Route8": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/watering/arm",
              "Method": "POST"
            }
          },
          "Route9": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/watering/disarm",
              "Method": "POST"
            }
          },
          "Route10": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/watering/reset",
              "Method": "POST"
            }
          },
          "Route11": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/water",
              "Method": "POST"
            }
          },
          "Route12": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/arm",
              "Method": "POST"
            }
          },
          "Route13": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/disarm",
              "Method": "POST"
            }
          },
          "Route14": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "HttpApi"
              },
              "Path": "/api/reset_fault",
