      "Type": "AWS::Serverless::HttpApi",
      "Properties": {
        "Auth": {
          "DefaultAuthorizer": "Jwt",
          "Authorizers": {
            "Jwt": {
              "IdentitySource": "$request.header.Authorization",
              "JwtConfiguration": {
                "issuer": {
                  "Ref": "JwtIssuer"
